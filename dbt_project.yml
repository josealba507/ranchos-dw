name: 'ranchos_dw'
version: '1.0.0'
config-version: 2

profile: 'ranchos_dw'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# --- Arquitectura de capas (ver docs/fase2_arquitectura.md) ---
# L0 raw        -> fuera de dbt: dataset "ranchos", poblado por el pipeline
#                  EL (BigQuery Data Transfer + Workflow), nunca por un
#                  modelo dbt. Ver _ranchos__sources.yml.
# L1 staging    -> view, dataset stg_ranchos: 1:1 con la fuente, solo
#                  renombra/castea, nunca se consulta directo desde BI.
# L2 intermedio -> dos mecanismos distintos, mismo layer conceptual:
#                  - models/intermediate/: ephemeral (no persiste en
#                    BigQuery) para joins/reglas de negocio/conciliación.
#                  - snapshots/: table, dataset int_ranchos, para
#                    historización SCD tipo 2 de dimensiones que cambian
#                    (animal, lote, insumo).
# L3 marts      -> table, dataset marts_ranchos: modelo dimensional
#                  (dim_*/fct_*) organizado por dominio de negocio, no por
#                  tabla fuente. Motor del esquema estrella.
# L4 reporting  -> view (default; algunos modelos serán table — features/
#                  alertas), dataset rpt_ranchos: vistas de negocio con
#                  control de acceso, tablas de features para ML, tablas de
#                  alertas para reverse ETL. Es lo único a lo que BI/Looker
#                  Studio debe conectarse — nunca a marts_ranchos directo
#                  (ver docs/dama_governance.md sección 5).
# Transversal   -> metadata_ranchos: resultados de tests persistidos,
#                  histórico de freshness, auditoría de ejecuciones. Se
#                  activa en la Fase 5 (calidad de datos) — el dataset se
#                  documenta acá pero todavía no recibe escrituras.
models:
  ranchos_dw:
    staging:
      +materialized: view
      +schema: stg_ranchos
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts_ranchos
      comun:
        +tags: ['comun']
      finanzas:
        +tags: ['finanzas']
      leche:
        +tags: ['leche']
      hato:
        +tags: ['hato']
      veterinaria:
        +tags: ['veterinaria']
      insumos:
        +tags: ['insumos']
    reporting:
      +materialized: view
      +schema: rpt_ranchos
      finanzas:
        +tags: ['finanzas', 'reporting']
      leche:
        +tags: ['leche', 'reporting']
      hato:
        +tags: ['hato', 'reporting']
      veterinaria:
        +tags: ['veterinaria', 'reporting']
      insumos:
        +tags: ['insumos', 'reporting']

seeds:
  ranchos_dw:
    +schema: seeds_ranchos

snapshots:
  ranchos_dw:
    +schema: int_ranchos

vars:
  # Filtro estándar de vigencia — TODA fact table del proyecto operacional
  # (RanchOS) versiona históricamente en vez de hacer UPDATE in-place
  # (estado_registro: Activo/Corregido/Anulado). Cualquier modelo de marts
  # sobre una fact table DEBE filtrar por esta var, nunca hardcodear el
  # string 'Activo' suelto en el SQL. Ver docs/dama_governance.md.
  estado_registro_vigente: 'Activo'
