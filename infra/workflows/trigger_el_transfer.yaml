# Dispara el transfer config de BigQuery Data Transfer Service ("Dataset
# Copy") que replica ranchos-7c313:ranchos hacia alba-analytics-ganaderia:
# ranchos, ESPERA a que termine, y si terminó bien dispara el Cloud Run Job
# que corre `dbt build --target prod` — ver docs/fase_orquestacion_dbt.md
# para el porqué completo de esta orquestación (resuelve la carrera entre
# "raw quedó desactualizado por escrituras nuevas" y "los tests de
# reconciliación corren en un momento arbitrario", documentada ahí mismo).
#
# Por qué el trigger de la sync sigue siendo dinámico acá (no cambia de la
# versión anterior): la API startManualRuns exige un `requestedRunTime`
# explícito que un HTTP target fijo de Cloud Scheduler no puede generar
# solo — ver el resto de esta explicación en el historial de git de este
# archivo (versión previa, antes de sumar el polling + dbt).
#
# Si el Dataset Copy falla (o no termina dentro de max_intentos * espera),
# el Workflow NO dispara dbt — no tiene sentido correr `dbt build` contra
# una réplica que sabemos que no se actualizó, generaría ruido de falsos
# positivos en vez de una señal real. En vez de devolver un resultado
# "exitoso" con el detalle en el payload, la ejecución del Workflow
# FALLA de verdad (`raise`) en ese caso — ver docs/fase6_alarmas_tecnicas.md
# para el porqué: la alarma de Cloud Monitoring se engancha al estado de
# la EJECUCIÓN (SUCCEEDED/FAILED), no inspecciona el contenido del
# payload de retorno, así que "sync nunca sincronizó" tiene que
# manifestarse como una ejecución fallida para que la alarma la vea.
#
# Disparado por Cloud Scheduler 3x/día (8am/1pm/8pm hora de Panamá) — ver
# el job "dw-el-transfer-3x-diario" en Cloud Scheduler. Sin cambios acá.
#
# Deploy:
#   gcloud workflows deploy dw-trigger-el-transfer \
#     --project=alba-analytics-ganaderia \
#     --location=us-central1 \
#     --source=infra/workflows/trigger_el_transfer.yaml \
#     --service-account=dw-transfer-runner@alba-analytics-ganaderia.iam.gserviceaccount.com
#
# El resource name del transfer config (dw-el-transfer-config-name en Secret
# Manager, no un literal acá) porque es un identificador operacional del
# proyecto real, no algo que tenga sentido versionar en texto plano en un
# repo — mismo criterio que cualquier config sensible al entorno. La service
# account de este Workflow tiene roles/secretmanager.secretAccessor acotado
# a ESE secreto puntual, no a todo Secret Manager.

main:
  steps:
    - init:
        assign:
          - dbt_job_name: "projects/alba-analytics-ganaderia/locations/us-central1/jobs/dw-dbt-build"
          - poll_interval_seconds: 30
          - max_intentos: 60 # 60 * 30s = 30 min tope de espera
          - intentos: 0
          - now: ${time.format(sys.now())}
    - fetch_transfer_config:
        call: http.get
        args:
          url: "https://secretmanager.googleapis.com/v1/projects/alba-analytics-ganaderia/secrets/dw-el-transfer-config-name/versions/latest:access"
          auth:
            type: OAuth2
        result: secret_result
    - decode_transfer_config:
        assign:
          - transfer_config: ${text.decode(base64.decode(secret_result.body.payload.data))}
    - trigger_transfer:
        call: http.post
        args:
          url: ${"https://bigquerydatatransfer.googleapis.com/v1/" + transfer_config + ":startManualRuns"}
          auth:
            type: OAuth2
          body:
            requestedRunTime: ${now}
        result: transfer_result
    - extract_run_name:
        assign:
          - run_name: ${transfer_result.body.runs[0].name}
    - poll_transfer:
        steps:
          - check_status:
              call: http.get
              args:
                url: ${"https://bigquerydatatransfer.googleapis.com/v1/" + run_name}
                auth:
                  type: OAuth2
              result: run_status
          - log_status:
              call: sys.log
              args:
                json:
                  mensaje: "Estado del transfer"
                  run_name: ${run_name}
                  state: ${run_status.body.state}
                  intento: ${intentos + 1}
                severity: INFO
          - increment_attempts:
              assign:
                - intentos: ${intentos + 1}
          - evaluate:
              switch:
                - condition: ${run_status.body.state == "SUCCEEDED"}
                  next: trigger_dbt
                - condition: ${run_status.body.state == "FAILED" or run_status.body.state == "CANCELLED"}
                  next: transfer_no_exitoso
                - condition: ${intentos >= max_intentos}
                  next: transfer_timeout
          - wait_before_retry:
              call: sys.sleep
              args:
                seconds: ${poll_interval_seconds}
          - retry:
              next: poll_transfer
    - trigger_dbt:
        call: http.post
        args:
          url: ${"https://run.googleapis.com/v2/" + dbt_job_name + ":run"}
          auth:
            type: OAuth2
        result: dbt_run_result
    - return_success:
        return:
          transfer_state: ${run_status.body.state}
          dbt_run: ${dbt_run_result.body}
    - transfer_no_exitoso:
        raise:
          mensaje: "El Dataset Copy no termino en SUCCEEDED - dbt build NO se disparo"
          estado_transfer: ${run_status.body.state}
    - transfer_timeout:
        raise:
          mensaje: "Se agoto el tiempo de espera del polling - dbt build NO se disparo"
          max_intentos: ${max_intentos}
          ultimo_estado_visto: ${run_status.body.state}
