version: 2

models:
  - name: rpt_movimientos_insumo_recientes
    description: >
      Vista de negocio (L4) sobre fct_movimiento_insumo — nombres
      legibles en vez de FKs, sin necesidad de que BI conozca el esquema
      dimensional. Grano: un movimiento (heredado de fct_movimiento_insumo).
    config:
      meta:
        owner: josealba507@gmail.com
        domain: insumos
    columns:
      - name: fecha_movimiento
        tests:
          - not_null

      - name: nombre_finca
        tests:
          - not_null
