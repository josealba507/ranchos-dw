version: 2

# Declaración de las tablas fuente reales (el dataset operacional que hoy
# alimentan las Cloud Functions de ranchos--app). Ver docs/dama_governance.md
# sección 6 — todo modelo debe referenciar estas tablas vía {{ source(...) }},
# nunca con el nombre crudo en un FROM.
#
# Este dataset es la capa L0 (raw) del warehouse — una RÉPLICA analítica del
# dataset operacional real (ranchos-7c313:ranchos) dentro del proyecto del
# DW (alba-analytics-ganaderia), no una lectura cross-project directa. Migrado
# por primera vez (histórico completo, `bq cp` tabla por tabla) el
# 2026-07-21; actualizada 3x/día (8am/1pm/8pm hora Panamá) vía BigQuery Data
# Transfer Service ("Dataset Copy", overwrite completo — necesario porque las
# fact tables versionan correcciones Activo→Corregido, no solo agregan
# filas) disparado por Cloud Scheduler + Workflow (ver
# infra/workflows/trigger_el_transfer.yaml). Este dataset NUNCA se modifica
# ni se le aplica retención — es la fuente para reprocesar el histórico
# completo si cambia la lógica de negocio (ver docs/fase0_inspeccion.md,
# sección 0.4, y docs/fase2_arquitectura.md).
#
# loaded_at_field NO es uniforme entre tablas (verificado contra
# INFORMATION_SCHEMA.COLUMNS real, no asumido) — la mayoría de las tb_dim_*
# usan fecha_creacion, pero tb_dim_fincas usa fecha_registro; la mayoría de
# las tb_fact_* usan timestamp_registro, pero tb_fact_logs_actividad usa
# timestamp_evento. No copiar el patrón de otra tabla sin verificar.
#
# freshness: 2 niveles, no un único umbral para las 26 tablas — probado
# empíricamente (primera corrida real con 3/10 días parejo para todas
# marcó 18 de 26 como stale, la mayoría catálogos que por diseño casi no
# cambian, ej. tb_dim_fincas con 1 sola fila desde siempre). Default del
# source (dims/catálogos, bajo movimiento por naturaleza): warn 14 días /
# error 45 días. Override más ajustado en cada tabla tb_fact_* (captura
# operacional activa): warn 5 días / error 14 días. Ninguno de los 2 es un
# valor calibrado contra el patrón real de actividad de este ranch en
# particular — es un punto de partida técnicamente razonable (dim/catálogo
# vs. fact), a ajustar con el usuario si en la práctica sigue generando
# falsos positivos/negativos por tabla. Una tabla sin ninguna fila todavía
# (ej. tb_fact_salidas, ver docs/fase0_inspeccion.md) no tiene un
# "loaded_at_field" que evaluar — dbt lo reporta como no computable, no
# como una corrida rota.
#
# loaded_at_field de las tablas DIM (fecha_creacion/fecha_registro) va
# envuelto en un CAST a TIMESTAMP: son columnas DATE en el esquema real
# (ver arriba), y el mecanismo de source freshness de dbt-bigquery exige
# TIMESTAMP — sin el cast, falla con "Database Error" en vez de calcular
# un estado real de frescura.
#
# tests de reconciliación (Fase 5 del documento de especificación —
# "Conciliación: conteo de registros... contra documentos únicos en raw"):
# cada tabla compara su conteo de filas EXACTO contra la tabla
# correspondiente en el source `ranchos_operacional` (ranchos-7c313, la
# fuente real que alimentan las Cloud Functions de ranchos--app) — ver
# tests/generic/test_reconciliacion_conteo_raw_vs_operacional.sql. Falla si
# no coinciden, lo cual sería la señal de que la réplica EL (BigQuery Data
# Transfer) dejó de copiar algo. Los resultados de este test se persisten en
# el dataset metadata_ranchos (store_failures) para tener un histórico
# consultable de estas verificaciones, no solo una alarma puntual.
sources:
  - name: ranchos
    database: alba-analytics-ganaderia
    schema: ranchos
    description: >
      Dataset operacional de RanchOS — dimensiones y hechos poblados por
      las Cloud Functions de sync (ver CLAUDE.md de ranchos--app, sección
      Analítica). Cada fact table versiona históricamente
      (estado_registro: Activo/Corregido/Anulado) en vez de hacer UPDATE
      in-place.
    config:
      freshness:
        warn_after: {count: 14, period: day}
        error_after: {count: 45, period: day}
    tables:
      # --- Dimensiones núcleo (fincas/roles/usuarios) ---
      - name: tb_dim_fincas
        config:
          loaded_at_field: "cast(fecha_registro as timestamp)"
        tests:
          - reconciliacion_conteo_raw_vs_operacional:
              arguments:
                tabla_operacional: source('ranchos_operacional', 'tb_dim_fincas')
          - elementary.volume_anomalies:
              arguments:
                timestamp_column: fecha_registro
              config:
                tags: ['elementary']
                severity: warn
          - elementary.freshness_anomalies:
              arguments:
                timestamp_column: fecha_registro
              config:
                tags: ['elementary']
                severity: warn
          - elementary.all_columns_anomalies:
              config:
                tags: ['elementary']
                severity: warn
      - name: tb_dim_roles
